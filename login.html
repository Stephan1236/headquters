<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Log in to your Headquters client portal." />
    <title>Log in | Headquters</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-body">
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="login-title">
        <a class="brand auth-brand" href="index.html" aria-label="Headquters home"><span class="brand-mark">H</span><span>Headquters</span></a>
        <div class="auth-heading">
          <p class="eyebrow">Client portal</p>
          <h1 id="login-title">Welcome back.</h1>
          <p>Log in to see your team's latest momentum.</p>
        </div>
        <div class="social-login">
          <button class="social-button google-button" type="button" data-provider="Google"><span class="google-mark">G</span> Continue with Google</button>
          <button class="social-button apple-button" type="button" data-provider="Apple"><span class="apple-mark">●</span> Continue with Apple</button>
        </div>
        <div class="auth-divider"><span>or continue with email</span></div>
        <form class="auth-form" id="login-form">
          <label for="login-email">Work email<input id="login-email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required /></label>
          <label for="login-password">Password<div class="password-field"><input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" minlength="8" required /><button type="button" class="password-toggle" id="password-toggle" aria-label="Show password">Show</button></div></label>
          <div class="auth-options"><label class="checkbox-label"><input type="checkbox" name="remember" /> Remember me</label><a href="mailto:hello@headquters.com?subject=Password%20reset">Forgot password?</a></div>
          <button class="button button-primary" type="submit">Log in <span class="button-arrow">→</span></button>
          <p class="form-status" id="login-status" role="status" aria-live="polite"></p>
        </form>
        <p class="auth-footer">Need an account? <a href="signup.html">Create one</a></p>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
